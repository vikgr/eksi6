<svg xmlns="http://www.w3.org/2000/svg" width="680" height="320" viewBox="0 0 680 320" role="img"><title>DIR switch circuit</title><style>.t{font:14px 'DejaVu Sans',sans-serif;fill:#2C2C2A}.ts{font:12px 'DejaVu Sans',sans-serif;fill:#5F5E5A}.th{font:bold 14px 'DejaVu Sans',sans-serif;fill:#2C2C2A}.c-coral>rect{fill:#FAECE7;stroke:#993C1D}.c-coral>text.th{fill:#712B13}.c-coral>text.ts{fill:#993C1D}.c-teal>rect{fill:#E1F5EE;stroke:#0F6E56}.c-teal>text.th{fill:#085041}.c-teal>text.ts{fill:#0F6E56}.c-purple>rect{fill:#EEEDFE;stroke:#534AB7}.c-purple>text.th{fill:#3C3489}.c-purple>text.ts{fill:#534AB7}.c-gray>rect{fill:#F1EFE8;stroke:#5F5E5A}.c-gray>text.th{fill:#2C2C2A}.c-gray>text.ts{fill:#444441}</style>
<rect width="680" height="320" fill="#ffffff"/>
<line x1="140" y1="122" x2="190" y2="122" stroke="#D85A30" stroke-width="2"/>
<line x1="280" y1="122" x2="330" y2="122" stroke="#D85A30" stroke-width="2"/>
<circle cx="305" cy="122" r="4" fill="#D85A30"/>
<line x1="305" y1="122" x2="305" y2="180" stroke="#D85A30" stroke-width="2"/>
<path d="M295 216 L295 250 L330 250" fill="none" stroke="#5F5E5A" stroke-width="2" stroke-dasharray="6 4"/>
<path d="M390 80 L390 58 L500 58" fill="none" stroke="#D85A30" stroke-width="2" stroke-dasharray="5 3"/>
<line x1="390" y1="164" x2="390" y2="230" stroke="#5F5E5A" stroke-width="2" stroke-dasharray="6 4"/>
<g class="c-teal"><rect x="40" y="100" width="100" height="44" rx="8" stroke-width="1"/><text class="th" x="90" y="127" text-anchor="middle">ESP32 D27</text></g>
<g class="c-gray"><rect x="190" y="104" width="90" height="36" rx="4" stroke-width="1"/><text class="ts" x="235" y="126" text-anchor="middle">100 Ω</text></g>
<g class="c-gray"><rect x="250" y="180" width="90" height="36" rx="4" stroke-width="1"/><text class="ts" x="295" y="202" text-anchor="middle">100 kΩ</text></g>
<g class="c-coral"><rect x="330" y="80" width="120" height="84" rx="8" stroke-width="1"/><text class="th" x="390" y="127" text-anchor="middle">2N7000</text><text class="ts" x="342" y="126">G</text><text class="ts" x="390" y="98" text-anchor="middle">D</text><text class="ts" x="390" y="156" text-anchor="middle">S</text></g>
<g class="c-purple"><rect x="500" y="30" width="140" height="56" rx="8" stroke-width="1"/><text class="th" x="570" y="52" text-anchor="middle">DIR of L1 L2 L3</text><text class="ts" x="570" y="72" text-anchor="middle">joined together</text></g>
<g class="c-gray"><rect x="330" y="230" width="120" height="40" rx="6" stroke-width="1"/><text class="th" x="390" y="255" text-anchor="middle">GND</text></g>
<text class="ts" x="340" y="300" text-anchor="middle">Flat side facing you, legs down: S, G, D (left to right)</text>
</svg>
