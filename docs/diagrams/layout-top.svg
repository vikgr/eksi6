<svg xmlns="http://www.w3.org/2000/svg" width="680" height="410" viewBox="0 0 680 410" role="img"><title>Top layout 400 x 800 mm deck</title><style>.t{font:14px 'DejaVu Sans',sans-serif;fill:#2C2C2A}.ts{font:12px 'DejaVu Sans',sans-serif;fill:#5F5E5A}.th{font:bold 14px 'DejaVu Sans',sans-serif;fill:#2C2C2A}.c-coral>rect{fill:#FAECE7;stroke:#993C1D}.c-coral>text.th{fill:#712B13}.c-coral>text.ts{fill:#993C1D}.c-teal>rect{fill:#E1F5EE;stroke:#0F6E56}.c-teal>text.th{fill:#085041}.c-teal>text.ts{fill:#0F6E56}.c-purple>rect{fill:#EEEDFE;stroke:#534AB7}.c-purple>text.th{fill:#3C3489}.c-purple>text.ts{fill:#534AB7}.c-gray>rect{fill:#F1EFE8;stroke:#5F5E5A}.c-gray>text.th{fill:#2C2C2A}.c-gray>text.ts{fill:#444441}</style>
