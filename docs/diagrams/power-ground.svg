<svg xmlns="http://www.w3.org/2000/svg" width="680" height="500" viewBox="0 0 680 500" role="img"><title>Power and ground wiring</title><style>.t{font:14px 'DejaVu Sans',sans-serif;fill:#2C2C2A}.ts{font:12px 'DejaVu Sans',sans-serif;fill:#5F5E5A}.th{font:bold 14px 'DejaVu Sans',sans-serif;fill:#2C2C2A}.c-coral>rect{fill:#FAECE7;stroke:#993C1D}.c-coral>text.th{fill:#712B13}.c-coral>text.ts{fill:#993C1D}.c-teal>rect{fill:#E1F5EE;stroke:#0F6E56}.c-teal>text.th{fill:#085041}.c-teal>text.ts{fill:#0F6E56}.c-purple>rect{fill:#EEEDFE;stroke:#534AB7}.c-purple>text.th{fill:#3C3489}.c-purple>text.ts{fill:#534AB7}.c-gray>rect{fill:#F1EFE8;stroke:#5F5E5A}.c-gray>text.th{fill:#2C2C2A}.c-gray>text.ts{fill:#444441}</style>
<rect width="680" height="500" fill="#ffffff"/>
<line x1="170" y1="68" x2="210" y2="68" stroke="#E24B4A" stroke-width="3"/>
<line x1="320" y1="68" x2="360" y2="68" stroke="#E24B4A" stroke-width="3"/>
<line x1="480" y1="68" x2="520" y2="68" stroke="#E24B4A" stroke-width="3"/>
<line x1="580" y1="96" x2="580" y2="160" stroke="#E24B4A" stroke-width="3"/>
<line x1="420" y1="96" x2="420" y2="160" stroke="#E24B4A" stroke-width="2"/>
<path d="M390 216 L390 250 L265 250 L265 280" fill="none" stroke="#BA7517" stroke-width="2"/>
<line x1="450" y1="216" x2="450" y2="280" stroke="#BA7517" stroke-width="2"/>
<line x1="105" y1="96" x2="105" y2="400" stroke="#5F5E5A" stroke-width="2" stroke-dasharray="6 4"/>
<line x1="580" y1="256" x2="580" y2="400" stroke="#5F5E5A" stroke-width="2" stroke-dasharray="6 4"/>
<path d="M480 200 L500 200 L500 400" fill="none" stroke="#5F5E5A" stroke-width="2" stroke-dasharray="6 4"/>
<line x1="265" y1="336" x2="265" y2="400" stroke="#5F5E5A" stroke-width="2" stroke-dasharray="6 4"/>
<line x1="420" y1="336" x2="420" y2="400" stroke="#5F5E5A" stroke-width="2" stroke-dasharray="6 4"/>
<g class="c-coral"><rect x="40" y="40" width="130" height="56" rx="8" stroke-width="1"/><text class="th" x="105" y="62" text-anchor="middle">Battery 36 V</text><text class="ts" x="105" y="82" text-anchor="middle">+ right, − down</text></g>
<g class="c-coral"><rect x="210" y="40" width="110" height="56" rx="8" stroke-width="1"/><text class="th" x="265" y="62" text-anchor="middle">Fuse</text><text class="ts" x="265" y="82" text-anchor="middle">40–60 A</text></g>
<g class="c-coral"><rect x="360" y="40" width="120" height="56" rx="8" stroke-width="1"/><text class="th" x="420" y="62" text-anchor="middle">Main switch</text><text class="ts" x="420" y="82" text-anchor="middle">e-stop</text></g>
<g class="c-coral"><rect x="520" y="40" width="120" height="56" rx="8" stroke-width="1"/><text class="th" x="580" y="62" text-anchor="middle">V+ bus bar</text><text class="ts" x="580" y="82" text-anchor="middle">to all 6</text></g>
<g class="c-purple"><rect x="520" y="160" width="120" height="96" rx="8" stroke-width="1"/><text class="th" x="580" y="200" text-anchor="middle">6 controllers</text><text class="ts" x="580" y="222" text-anchor="middle">L1–L3, R1–R3</text></g>
<g class="c-teal"><rect x="360" y="160" width="120" height="56" rx="8" stroke-width="1"/><text class="th" x="420" y="182" text-anchor="middle">Buck to 5 V</text><text class="ts" x="420" y="202" text-anchor="middle">≥60 V input</text></g>
<g class="c-teal"><rect x="210" y="280" width="110" height="56" rx="8" stroke-width="1"/><text class="th" x="265" y="302" text-anchor="middle">ESP32</text><text class="ts" x="265" y="322" text-anchor="middle">VIN and GND</text></g>
<g class="c-teal"><rect x="360" y="280" width="120" height="56" rx="8" stroke-width="1"/><text class="th" x="420" y="302" text-anchor="middle">Receiver</text><text class="ts" x="420" y="322" text-anchor="middle">+ and − pins</text></g>
<g class="c-gray"><rect x="40" y="400" width="600" height="40" rx="6" stroke-width="1"/><text class="th" x="340" y="425" text-anchor="middle">Common ground bar (battery −)</text></g>
<line x1="40" y1="475" x2="80" y2="475" stroke="#E24B4A" stroke-width="3"/><text class="ts" x="88" y="479">36 V +</text>
<line x1="180" y1="475" x2="220" y2="475" stroke="#BA7517" stroke-width="2"/><text class="ts" x="228" y="479">5 V</text>
<line x1="300" y1="475" x2="340" y2="475" stroke="#5F5E5A" stroke-width="2" stroke-dasharray="6 4"/><text class="ts" x="348" y="479">Ground</text>
</svg>
