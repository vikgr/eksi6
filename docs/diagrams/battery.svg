<svg xmlns="http://www.w3.org/2000/svg" width="680" height="430" viewBox="0 0 680 430" role="img"><title>Makita battery system, 2S and 2S2P</title><style>.t{font:14px 'DejaVu Sans',sans-serif;fill:#2C2C2A}.ts{font:12px 'DejaVu Sans',sans-serif;fill:#5F5E5A}.th{font:bold 14px 'DejaVu Sans',sans-serif;fill:#2C2C2A}.c-coral>rect{fill:#FAECE7;stroke:#993C1D}.c-coral>text.th{fill:#712B13}.c-coral>text.ts{fill:#993C1D}.c-teal>rect{fill:#E1F5EE;stroke:#0F6E56}.c-teal>text.th{fill:#085041}.c-teal>text.ts{fill:#0F6E56}.c-purple>rect{fill:#EEEDFE;stroke:#534AB7}.c-purple>text.th{fill:#3C3489}.c-purple>text.ts{fill:#534AB7}.c-gray>rect{fill:#F1EFE8;stroke:#5F5E5A}.c-gray>text.th{fill:#2C2C2A}.c-gray>text.ts{fill:#444441}</style>
<rect width="680" height="430" fill="#ffffff"/>
<line x1="110" y1="60" x2="110" y2="90" stroke="#E24B4A" stroke-width="3"/>
<line x1="290" y1="60" x2="290" y2="90" stroke="#E24B4A" stroke-width="3" stroke-dasharray="7 4"/>
<line x1="110" y1="130" x2="110" y2="160" stroke="#E24B4A" stroke-width="3"/>
<line x1="290" y1="130" x2="290" y2="160" stroke="#E24B4A" stroke-width="3" stroke-dasharray="7 4"/>
<line x1="110" y1="210" x2="110" y2="240" stroke="#E24B4A" stroke-width="3"/>
<line x1="290" y1="210" x2="290" y2="240" stroke="#E24B4A" stroke-width="3" stroke-dasharray="7 4"/>
<line x1="110" y1="290" x2="110" y2="320" stroke="#5F5E5A" stroke-width="3"/>
<line x1="290" y1="290" x2="290" y2="320" stroke="#5F5E5A" stroke-width="3" stroke-dasharray="7 4"/>
<line x1="360" y1="45" x2="440" y2="45" stroke="#E24B4A" stroke-width="3"/>
<path d="M400 45 L400 155 L440 155" fill="none" stroke="#7F77DD" stroke-width="2"/>
<path d="M110 225 L200 225 L200 235 L440 235" fill="none" stroke="#7F77DD" stroke-width="2"/>
<circle cx="110" cy="225" r="4" fill="#7F77DD"/>
<line x1="360" y1="335" x2="440" y2="335" stroke="#5F5E5A" stroke-width="3"/>
<g class="c-coral"><rect x="40" y="30" width="320" height="30" rx="4" stroke-width="1"/><text class="th" x="200" y="50" text-anchor="middle">+ bus (30–42 V)</text></g>
<g class="c-gray"><rect x="40" y="90" width="140" height="40" rx="4" stroke-width="1"/><text class="ts" x="110" y="114" text-anchor="middle">ideal diode (stage 2)</text></g>
<g class="c-gray"><rect x="220" y="90" width="140" height="40" rx="4" stroke-width="1" stroke-dasharray="5 3"/><text class="ts" x="290" y="114" text-anchor="middle">ideal diode</text></g>
<g class="c-coral"><rect x="40" y="160" width="140" height="50" rx="6" stroke-width="1"/><text class="th" x="110" y="181" text-anchor="middle">Pack A1</text><text class="ts" x="110" y="199" text-anchor="middle">Makita 18 V 5 Ah</text></g>
<g class="c-coral"><rect x="40" y="240" width="140" height="50" rx="6" stroke-width="1"/><text class="th" x="110" y="261" text-anchor="middle">Pack B1</text><text class="ts" x="110" y="279" text-anchor="middle">Makita 18 V 5 Ah</text></g>
<g class="c-coral"><rect x="220" y="160" width="140" height="50" rx="6" stroke-width="1" stroke-dasharray="5 3"/><text class="th" x="290" y="181" text-anchor="middle">Pack A2</text><text class="ts" x="290" y="199" text-anchor="middle">optional</text></g>
<g class="c-coral"><rect x="220" y="240" width="140" height="50" rx="6" stroke-width="1" stroke-dasharray="5 3"/><text class="th" x="290" y="261" text-anchor="middle">Pack B2</text><text class="ts" x="290" y="279" text-anchor="middle">optional</text></g>
<g class="c-gray"><rect x="40" y="320" width="320" height="30" rx="4" stroke-width="1"/><text class="th" x="200" y="340" text-anchor="middle">− / ground bar</text></g>
<g class="c-coral"><rect x="440" y="25" width="200" height="40" rx="6" stroke-width="1"/><text class="th" x="540" y="50" text-anchor="middle">Fuse → e-stop → bus</text></g>
<g class="c-teal"><rect x="440" y="130" width="200" height="50" rx="6" stroke-width="1"/><text class="th" x="540" y="151" text-anchor="middle">Divider 100k / 6.8k</text><text class="ts" x="540" y="169" text-anchor="middle">total → ESP32 D36 (VP)</text></g>
<g class="c-teal"><rect x="440" y="210" width="200" height="50" rx="6" stroke-width="1"/><text class="th" x="540" y="231" text-anchor="middle">Divider 100k / 6.8k</text><text class="ts" x="540" y="249" text-anchor="middle">middle → ESP32 D39 (VN)</text></g>
<g class="c-gray"><rect x="440" y="315" width="200" height="40" rx="6" stroke-width="1"/><text class="th" x="540" y="340" text-anchor="middle">To ground bar</text></g>
<text class="ts" x="40" y="385">Stage 1: string 1 only (A1 + B1 in series) = 36 V, 5 Ah, 180 Wh. No diode needed.</text>
<text class="ts" x="40" y="405">Stage 2: add string 2 (dashed) + one ideal diode per string = 36 V, 10 Ah, 360 Wh.</text>
</svg>
